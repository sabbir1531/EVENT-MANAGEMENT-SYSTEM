<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register — Gatherly</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">g</span>gatherly</a>
    </header>
    <main class="auth-page">
        <form class="auth-card" id="registerForm">
            <p class="eyebrow">Your next moment awaits</p>
            <h1>Create your account</h1><label>Full name<input required type="text" name="name"
                    placeholder="Your name"></label><label>Email<input required type="email" name="email"
                    placeholder="you@example.com"></label><label>Password<input required minlength="8" type="password"
                    name="password" placeholder="At least 8 characters"></label>
            <p id="formMessage" class="form-message"></p><button class="button button-dark" type="submit">Create account
                <span>→</span></button>
            <p>Already have an account? <a href="login.html">Log in</a></p>
        </form>
    </main>
    <script src="auth.js"></script>
</body>

</html>
